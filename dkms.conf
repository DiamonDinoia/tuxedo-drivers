PACKAGE_NAME=clevo-keyboard
PACKAGE_VERSION=4.25.0+diamon1

DEST_MODULE_LOCATION[0]="/kernel/lib/"
BUILT_MODULE_NAME[0]="clevo_keyboard"
BUILT_MODULE_LOCATION[0]="src/"

DEST_MODULE_LOCATION[1]="/kernel/lib/"
BUILT_MODULE_NAME[1]="clevo_wmi"
BUILT_MODULE_LOCATION[1]="src/"

DEST_MODULE_LOCATION[2]="/kernel/lib/"
BUILT_MODULE_NAME[2]="clevo_acpi"
BUILT_MODULE_LOCATION[2]="src/"

# clevo_acpi.c uses acpi_dev_install_notify_handler() and
# acpi_dev_remove_notify_handler(), which first appeared in mainline v6.6
# (commit c542ce36a9f0, "ACPI: bus: Introduce wrappers for ACPICA notify
# handler install/remove"). DKMS must skip the build on older kernels, not
# fail it. Per-API table and evidence: juno/PATCHES.md section 5.
BUILD_EXCLUSIVE_KERNEL_MIN="6.6"

MAKE[0]="make KDIR=/lib/modules/${kernelver}/build"
CLEAN="make clean"
AUTOINSTALL="yes"
